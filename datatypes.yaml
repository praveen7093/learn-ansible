- name : course information
  hosts: local
  connection: local
  vars:
    course: "Hello praveen is a string"
    duration_in_hrs: 190 #number
    is_live_sessions: tre #boolean
    topics: #list
      - linux
      - shell scripting
      - ansible
      - terraform
    more_details:
      trainer: siva 
      months: 4
      exact_duration_in_months: 4.5
    tasks :
      - name : print info and type
        debug:
          msg : |
            name : "{{ course }} : {{ course | type_debug }}"
