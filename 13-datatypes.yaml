- name : course information
  hosts: local
  connection: local
  vars:
    course: "Hello praveen is a string"
    duration_in_hrs: 190 #number
    is_live_sessions: true #boolean
    topics: #list
      - linux
      - shell scripting
      - ansible
      - terraform
    more_details:
      trainer: siva 
      months: 4
    exact_duration_in_months: 4.5
  tasks :
      - name : print info and type
        debug:
          msg : |
            name : "{{ course }} : {{ course | type_debug }}"
            duration: " {{ duration_in_hrs }} : {{ duration_in_hrs | type_debug }}"
            is live : " {{ is_live_sessions }} : {{ is_live_sessions | type_debug }}"
            topics : " {{ topics }} : {{ topics | type_debug }}"
            more details : " {{ more_details }} : {{ more_details | type_debug }} "
            duration months: " {{  exact_duration_in_months }} : {{  exact_duration_in_months | type_debug }}"

