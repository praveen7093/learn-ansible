- name: print OS is redhat or not
  hosts: local
  become: yes
  connection: local
  tasks:
  - name: install ngninx in redhat
    dnf:
      name: nginx
      state: present
    when: ansible_facts.os_family == "RedHat"

  - name : install ngnix in debian
    apt:
      name: nginx
      state: present
    when: ansible_facts.os_family == "Debian"
