- name: even or odd
  hosts: local
  connection: local

  vars:
    number: 10

  tasks:
    - name: is even
      debug:
        msg: "Given number: {{ number }} is even"
      when: number % 2 == 0

    - name: is odd
      debug:
        msg: "Given number: {{ number }} is odd"
      when: number % 2 != 0
