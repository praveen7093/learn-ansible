- name : filters
  hosts: local
  connection: local
  vars:
    topics: "Liinux, Shell, Ansible , Terraform"
  tasks:
    - name : print the name
      debug:
        msg : "Hi, {{ person_name | default('Ramesh') }}"
    - name : convert string to list
      debug:
        msg : " Topics are {{ topics | split(',')}}"